<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Omni demo scene</title>
<style>
  @font-face { font-family: "Manrope"; src: url("Manrope-latin.woff2") format("woff2"); font-weight: 400 800; }
  :root { --primary: #084efb; --tint: #e6edff; --ink: #0f1a33; --ink-55: rgba(15,26,51,.58); --ink-08: rgba(15,26,51,.08); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 360px; height: 740px; overflow: hidden; font-family: "Manrope", system-ui, sans-serif; color: var(--ink); background: #ffffff; }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .status { position: absolute; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 15px; font-weight: 600; z-index: 3; }
  .status__icons { display: flex; gap: 6px; align-items: center; }
  .status__icons i { display: block; width: 4px; background: var(--ink); border-radius: 1px; }
  .battery { width: 24px; height: 12px; border: 1.5px solid var(--ink); border-radius: 3px; padding: 1.5px; margin-left: 4px; }
  .battery::after { content: ""; display: block; width: 70%; height: 100%; background: var(--ink); border-radius: 1px; }

  .site { position: absolute; inset: 44px 0 0; padding: 0 20px; }
  .site__nav { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .site__logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
  .site__logo b { width: 24px; height: 24px; border-radius: 7px; background: #1f2a44; }
  .site__menu { width: 22px; display: grid; gap: 5px; } .site__menu i { height: 2px; background: var(--ink); border-radius: 2px; }
  .site h1 { margin: 22px 0 0; font-size: 31px; line-height: 1.08; letter-spacing: -.025em; }
  .site p { margin: 14px 0 0; color: var(--ink-55); font-size: 15px; line-height: 1.5; }
  .site__cta { display: inline-block; margin-top: 20px; padding: 12px 18px; border-radius: 12px; background: #1f2a44; color: #fff; font-size: 14px; font-weight: 600; }
  .site__img { height: 210px; margin-top: 26px; border-radius: 18px; background: linear-gradient(135deg, #d7f5fe, #e6edff 55%, #e9e5ff); }

  .bubble { position: absolute; right: 18px; bottom: 22px; width: 56px; height: 56px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 10px 24px -8px rgba(8,78,251,.55), 0 0 0 1px rgba(15,26,51,.06); z-index: 4; }
  .bubble img { width: 44px; height: 44px; }
  .tap { position: absolute; right: 18px; bottom: 22px; width: 56px; height: 56px; border-radius: 50%; border: 3px solid rgba(8,78,251,.45); z-index: 5; opacity: 0; }

  .chat { position: absolute; left: 10px; right: 10px; bottom: 12px; height: 560px; border-radius: 22px; background: #fff; box-shadow: 0 24px 60px -18px rgba(15,26,51,.45), 0 0 0 1px var(--ink-08); display: flex; flex-direction: column; overflow: hidden; z-index: 6; opacity: 0; }
  .chat__head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--ink-08); }
  .avatar { width: 38px; height: 38px; display: block; }
  
  .chat__title { font-weight: 700; font-size: 16px; line-height: 1.2; }
  .chat__sub { display: flex; align-items: center; gap: 6px; color: var(--ink-55); font-size: 12.5px; }
  .chat__sub::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #22a04b; }
  .chat__close { margin-left: auto; color: var(--ink-55); } .chat__close svg { width: 20px; height: 20px; }
  .msgs { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 14px 16px; overflow: hidden; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 18px; font-size: 14.5px; line-height: 1.42; display: none; }
  .msg--bot { align-self: flex-start; background: #eef2fb; border-bottom-left-radius: 6px; }
  .msg--me { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 6px; }
  .typing { align-self: flex-start; display: none; gap: 5px; padding: 14px 16px; border-radius: 18px; border-bottom-left-radius: 6px; background: #eef2fb; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: rgba(15,26,51,.4); }
  .lead { align-self: stretch; display: none; padding: 14px; border: 1px solid var(--ink-08); border-radius: 16px; background: #fff; box-shadow: 0 8px 24px -14px rgba(15,26,51,.35); }
  .lead__row { margin-bottom: 10px; } .lead__row label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-55); margin-bottom: 4px; }
  .lead__row div { height: 38px; padding: 0 12px; border: 1px solid rgba(15,26,51,.14); border-radius: 10px; display: flex; align-items: center; font-size: 14.5px; }
  .lead__btn { height: 40px; border-radius: 999px; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 14.5px; }
  .compose { display: flex; align-items: center; gap: 10px; margin: 0 14px 14px; padding: 6px 6px 6px 16px; border: 1px solid rgba(15,26,51,.14); border-radius: 16px; font-size: 14.5px; }
  .compose__text { flex: 1; min-height: 20px; color: var(--ink); white-space: nowrap; overflow: hidden; }
  .compose__text.is-empty { color: rgba(15,26,51,.4); }
  .caret { display: inline-block; width: 1.5px; height: 17px; margin-left: 1px; background: var(--primary); vertical-align: -3px; }
  .send { width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; }
  .send svg { width: 17px; height: 17px; }

  .toast { position: absolute; top: 52px; left: 14px; right: 14px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: #0f1a33; color: #fff; box-shadow: 0 18px 40px -16px rgba(0,0,0,.5); z-index: 8; opacity: 0; }
  .toast__icon { width: 34px; height: 34px; border-radius: 50%; background: #22a04b; display: grid; place-items: center; flex: none; }
  .toast__icon svg { width: 18px; height: 18px; stroke-width: 2.6; }
  .toast b { display: block; font-size: 14px; } .toast span { font-size: 12.5px; color: rgba(255,255,255,.7); }
</style>
</head>
<body>
  <div class="status"><span data-t="time"></span><span class="status__icons"><i style="height:5px"></i><i style="height:8px"></i><i style="height:11px"></i><span class="battery"></span></span></div>

  <div class="site">
    <div class="site__nav"><span class="site__logo"><b></b><span data-t="firm"></span></span><span class="site__menu"><i></i><i></i><i></i></span></div>
    <h1 data-t="headline"></h1>
    <p data-t="tagline"></p>
    <span class="site__cta" data-t="book"></span>
    <div class="site__img"></div>
  </div>

  <div class="bubble" id="bubble"><img src="omni-logo.png" alt=""></div>
  <div class="tap" id="tap"></div>

  <div class="chat" id="chat">
    <div class="chat__head">
      <img class="avatar" src="omni-logo.png" alt="">
      <span><span class="chat__title" data-t="firm"></span><span class="chat__sub" data-t="online"></span></span>
      <span class="chat__close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>
    </div>
    <div class="msgs">
      <div class="msg msg--bot" data-at="2.1" data-t="hello"></div>
      <div class="msg msg--me" data-at="4.5" data-t="ask"></div>
      <div class="typing" data-from="4.9" data-to="5.9"><i></i><i></i><i></i></div>
      <div class="msg msg--bot" data-at="5.9" data-t="closed"></div>
      <div class="msg msg--me" data-at="8.2" data-t="callMe"></div>
      <div class="typing" data-from="8.5" data-to="9.2"><i></i><i></i><i></i></div>
      <div class="msg msg--bot" data-at="9.2" data-t="details"></div>
      <div class="lead" data-at="9.5">
        <div class="lead__row"><label data-t="name"></label><div data-type="Camille D." data-type-from="9.9" data-type-to="10.6"></div></div>
        <div class="lead__row"><label data-t="phone"></label><div data-t-type="phoneValue" data-type-from="10.7" data-type-to="11.5"></div></div>
        <div class="lead__btn" id="leadBtn"></div>
      </div>
      <div class="typing" data-from="11.9" data-to="12.4"><i></i><i></i><i></i></div>
      <div class="msg msg--bot" data-at="12.4" data-t="thanks"></div>
    </div>
    <div class="compose"><span class="compose__text" id="compose"></span><span class="send"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></span></div>
  </div>

  <div class="toast" id="toast">
    <span class="toast__icon"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>
    <span><b data-t="toastTitle"></b><span data-t="toastBody"></span></span>
  </div>

<script>
  const DURATION = 15;
  const clamp = v => Math.min(1, Math.max(0, v));
  const ease = v => 1 - Math.pow(1 - clamp(v), 3);
  const span = (t, from, to) => clamp((t - from) / (to - from));
  const $ = id => document.getElementById(id);
  // Scene text per language: demo.html?lang=en (default) or ?lang=fr.
  const TEXT = {
    en: {
      time: "9:47", firm: "Durand Advisory", headline: "Your wealth, with a real adviser.", tagline: "Retirement, savings and protection for the self-employed.", book: "Book a meeting",
      online: "Assistant, online", hello: "Hi! I’m the firm’s assistant. How can I help?", ask: "Are you open on Saturday?",
      closed: "The office is closed at weekends. I can answer your questions now, or arrange a call back on Monday morning.", callMe: "Yes, call me on Monday",
      details: "Happy to. Please leave your details:", name: "Name", phone: "Phone", phoneValue: "+33 6 12 34 56 78", send: "Send", sent: "Sent",
      thanks: "Thanks Camille, an adviser will call you on Monday morning.", placeholder: "Type your message…",
      toastTitle: "New lead: Camille D.", toastBody: "Call back requested for Monday morning"
    },
    fr: {
      time: "21:47", firm: "Cabinet Durand", headline: "Votre patrimoine, avec un vrai conseiller.", tagline: "Retraite, épargne et prévoyance pour les indépendants.", book: "Prendre rendez-vous",
      online: "Assistant, en ligne", hello: "Bonjour ! Je suis l’assistant du cabinet. Comment puis-je vous aider ?", ask: "Vous êtes ouverts samedi ?",
      closed: "Le cabinet est fermé le week-end. Je peux répondre à vos questions dès maintenant, ou organiser un rappel lundi matin.", callMe: "Oui, rappelez-moi lundi",
      details: "Avec plaisir. Laissez-moi vos coordonnées :", name: "Nom", phone: "Téléphone", phoneValue: "06 12 34 56 78", send: "Envoyer", sent: "Envoyé",
      thanks: "Merci Camille, un conseiller vous rappelle lundi matin.", placeholder: "Écrivez votre message…",
      toastTitle: "Nouveau lead : Camille D.", toastBody: "Rappel demandé lundi matin"
    }
  };
  const LANG = new URLSearchParams(location.search).get("lang") === "fr" ? "fr" : "en";
  const T = TEXT[LANG];
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T[el.dataset.t]; });
  document.querySelectorAll("[data-t-type]").forEach(el => { el.dataset.type = T[el.dataset.tType]; });
  const typed = [
    { from: 3.2, to: 4.3, text: T.ask, sent: 4.5 },
    { from: 7.0, to: 8.0, text: T.callMe, sent: 8.2 }
  ];

  window.render = t => {
    // Loop: everything fades back to the plain page over the last 0.8s.
    const outro = 1 - ease(span(t, DURATION - 0.8, DURATION));

    const bubbleIn = ease(span(t, 0.2, 0.7));
    const open = ease(span(t, 1.45, 1.9));
    const bubbleBack = ease(span(t, DURATION - 0.8, DURATION));
    $("bubble").style.transform = `scale(${0.6 + 0.4 * bubbleIn - 0.08 * span(t, 1.2, 1.35) + 0.08 * span(t, 1.35, 1.5)})`;
    $("bubble").style.opacity = t < 1.9 ? bubbleIn * (1 - open) : bubbleBack;

    const tap = span(t, 1.2, 1.75);
    $("tap").style.opacity = tap > 0 && tap < 1 ? 1 - tap : 0;
    $("tap").style.transform = `scale(${1 + tap * 0.9})`;

    $("chat").style.opacity = open * outro;
    $("chat").style.transform = `translateY(${(1 - open) * 40}px) scale(${0.96 + 0.04 * open})`;

    document.querySelectorAll("[data-at]").forEach(el => {
      const at = Number(el.dataset.at);
      el.style.display = t >= at ? (el.classList.contains("lead") ? "block" : "block") : "none";
      const p = ease(span(t, at, at + 0.3));
      el.style.opacity = p;
      el.style.transform = `translateY(${(1 - p) * 10}px)`;
    });
    document.querySelectorAll(".typing").forEach(el => {
      const on = t >= Number(el.dataset.from) && t < Number(el.dataset.to);
      el.style.display = on ? "flex" : "none";
      [...el.children].forEach((dot, i) => { dot.style.opacity = 0.35 + 0.65 * Math.abs(Math.sin((t * 5) - i * 0.7)); });
    });
    document.querySelectorAll("[data-type]").forEach(el => {
      const p = span(t, Number(el.dataset.typeFrom), Number(el.dataset.typeTo));
      el.textContent = el.dataset.type.slice(0, Math.round(p * el.dataset.type.length));
    });
    $("leadBtn").style.transform = `scale(${1 - 0.05 * (span(t, 11.6, 11.7) - span(t, 11.7, 11.85))})`;
    $("leadBtn").style.opacity = t >= 11.75 ? 0.55 : 1;
    $("leadBtn").textContent = t >= 11.75 ? T.sent : T.send;

    const compose = $("compose");
    const active = typed.find(entry => t >= entry.from && t < entry.sent);
    if (active) {
      const text = active.text.slice(0, Math.round(span(t, active.from, active.to) * active.text.length));
      compose.className = "compose__text";
      compose.innerHTML = text.replace(/&/g, "&amp;").replace(/</g, "&lt;") + '<span class="caret"></span>';
    } else {
      compose.className = "compose__text is-empty";
      compose.textContent = T.placeholder;
    }

    const toast = ease(span(t, 12.8, 13.25)) * (1 - ease(span(t, DURATION - 1.2, DURATION - 0.6)));
    $("toast").style.opacity = toast;
    $("toast").style.transform = `translateY(${(1 - toast) * -24}px)`;
  };
  window.DURATION = DURATION;
  render(0);
</script>
</body>
</html>
